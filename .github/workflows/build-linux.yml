name: build-linux

# Linux（AppImage）构建。**故意不并进 build.yml**：那里只有 windows job，
# 单独开一个文件，原作者那边 review 时 diff 只多一个新文件，改 Windows 的风险为零。
#
# 触发条件跟 build.yml 保持一致（push main / PR / 手动）。
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  linux:
    name: AppImage x86_64
    # 宿主只提供内核，真正干活的是下面的容器 userland。
    runs-on: ubuntu-24.04
    container: debian:bookworm-slim
    # **必须显式写**：container job 里 run: 的默认 shell 是 sh（dash），
    # 而下面几个步骤用了 pipefail / <<<herestring / {a,b} 花括号展开，
    # 全是 bash 才有的。一不显式声明就是
    #   set: Illegal option -o pipefail
    defaults:
      run:
        shell: bash
    steps:
      # 依赖装在 checkout 之前：debian:bookworm-slim 里没有 git，
      # 先装上 git，checkout 才走 git 而不是退化成 REST API 下载 tarball。
      # 顺带把 git config 也提前设好，免得 checkout 在 root 下被 dubious ownership 拦。
      - name: 装构建依赖
        run: |
          apt-get update
          DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
            git ca-certificates \
            binutils curl file xz-utils \
            python3 gcc procps \
            libx11-dev libxft-dev libfreetype-dev libfontconfig1-dev \
            squashfs-tools \
            clang libfuse3-dev libsquashfuse-dev \
            liblz4-dev liblzo2-dev liblzma-dev libzstd-dev zlib1g-dev \
            xvfb x11-utils xdotool imagemagick fonts-noto-cjk
          git config --global --add safe.directory '*'
          # 工具链完整性自查：把 workflow 和四个脚本真正调到的外部命令挨个过一遍，
          # 少一个就在这里炸，别拖到几百行之后才报 command not found。
          missing=''
          for c in bash sed awk grep find mktemp readlink stat tail head basename dirname \
                   cat cp mv chmod strip file nm git curl tar xz \
                   python3 gcc clang node mksquashfs ldd pkill \
                   xwininfo xdotool import convert; do
            command -v "$c" >/dev/null 2>&1 || missing="$missing $c"
          done
          if [ -n "$missing" ]; then
            echo "::error::缺这些命令：$missing"
            exit 1
          fi
          echo "工具链齐全 ✓（$(command -v bash | head -1) / shell=$BASH_VERSION）"

      - uses: actions/checkout@v5

      # runtime.c 是按 sqfs_opts 的内存布局写 mountpoint 的，链接进去的
      # libsquashfuse 按它自己那版布局写 —— 版本一错位，编译照过、运行时报
      # "Usage: ... ARCHIVE MOUNTPOINT"。这里提前钉死，别等产物坏了才发现。
      #
      # 之所以用 debian:bookworm 容器而不是 ubuntu runner：
      #   ubuntu-22.04 的 libsquashfuse-dev 是 0.1.103-3，**编不出 FUSE 版**——
      #   包里 sqfs_ll_op_* / setup_idle_timeout 这些低层 FUSE 实现整个缺失
      #   （实测：三个 .a 和三个 .so 里一个都没有），链接必然失败。
      #   ubuntu-24.04 是 0.5.0，API 与 sqfs_opts 布局早就不兼容了。
      #   bookworm 的 0.1.105-1 是唯一现成可用的组合，也就是本地验证时用的那套。
      #   换容器基础镜像前，先照 正式版/tools/appimage-runtime/README.md 重新验一遍。
      - name: 核对 libsquashfuse（版本 + 符号）
        run: |
          set -uo pipefail
          got=$(dpkg-query -W -f='${Version}' libsquashfuse-dev)
          echo "libsquashfuse-dev = $got"
          case "$got" in
            0.1.105*) ;;
            *) echo "::error::squashfuse 不是 0.1.105，runtime 会链错。版本配套表见 正式版/tools/appimage-runtime/README.md" ; exit 1 ;;
          esac
          # 版本号对了也不一定够用：Ubuntu 22.04 的 0.1.103-3 头文件里 sqfs_opts
          # 布局跟 0.1.105 一模一样，看着没问题，但三个静态库里 sqfs_ll_op_*、
          # setup_idle_timeout 这些低层 FUSE 实现**一个都没有**（Ubuntu 那版把
          # FUSE 支持裁掉了），链接会刷一屏 undefined reference。直接查符号。
          syms=$(nm -g --defined-only /usr/lib/x86_64-linux-gnu/lib{squashfuse,squashfuse_ll,fuseprivate}.a 2>/dev/null || true)
          bad=0
          for s in sqfs_ll_op_create sqfs_ll_op_read stfs_ll_op_statfs setup_idle_timeout sqfs_opt_proc sqfs_usage; do
            if ! grep -qw "$s" <<<"$syms"; then
              echo "::error::libsquashfuse-dev 静态库缺少符号 $s，这个版本编不出带 FUSE 的 runtime"
              bad=1
            fi
          done
          [ "$bad" = 0 ] || exit 1
          echo "低层 FUSE 符号齐全 ✓"

      - uses: actions/setup-node@v5
        with:
          node-version: '20'

      - name: 装 Zig 0.14.1
        run: |
          set -euo pipefail
          # node 是打包脚本的硬依赖（生成图集 + 切图标），前面已经装过。
          # 顺带确认 setup-node 在容器里真的把 node 放上了 PATH。
          command -v node >/dev/null || { echo "::error::node 不在 PATH 上，gen_atlas.js / make_icon.js 跑不了"; exit 1; }
          node --version

          url='https://ziglang.org/download/0.14.1/zig-x86_64-linux-0.14.1.tar.xz'
          curl -fsSL -m 300 -o "$RUNNER_TEMP/zig.tar.xz" "$url"
          # tar 自己不带 xz 解压器，会 exec 外部的 xz —— slim 镜像里默认没有，
          # 所以上面必须装 xz-utils，否则这里报 "xz: Cannot exec"。
          tar -xf "$RUNNER_TEMP/zig.tar.xz" -C "$RUNNER_TEMP"
          dir=$(find "$RUNNER_TEMP" -maxdepth 1 -type d -name 'zig-*linux*' | head -1)
          [ -n "$dir" ] || { echo '解压后找不到 zig 目录'; exit 1; }
          echo "$dir" >> "$GITHUB_PATH"
          got=$("$dir/zig" version)
          echo "zig = $got（$(basename "$dir")）"
          [ "$got" = '0.14.1' ] || { echo "Zig 版本不对：$got，本工程按 0.14.1 写"; exit 1; }

      # runtime-x86_64 是编译产物、不入库（见 .gitignore），CI 里现编。
      - name: 编 AppImage type 2 runtime
        working-directory: 正式版
        run: |
          set -euo pipefail
          ./tools/appimage-runtime/build-runtime.sh
          ls -l tools/appimage-runtime/runtime-x86_64

      # src/x11.zig 的 Xlib 绑定是手写的：extern 参数个数或 struct 成员写错都不报错，
      # 只在运行到那一行时炸。对账脚本读真头文件逐个核。
      - name: X11 绑定对账
        working-directory: 正式版
        run: ./tools/check_x11_abi.sh

      - name: 编译 + 规则自检 + 打 AppImage
        working-directory: 正式版
        run: ./build-linux.sh

      - name: 验 AppImage 本身
        run: |
          set -euo pipefail
          A=$(readlink -f "$(ls 正式版/build/*.AppImage)")
          echo "== $A"

          "$A" --appimage-offset        # runtime 解析自己的 ELF 节头算偏移量
          "$A" --appimage-version

          # --appimage-extract 走的是 runtime 里的解压分支，不需要 FUSE
          tmp=$(mktemp -d)
          (cd "$tmp" && "$A" --appimage-extract)
          ls -l "$tmp/squashfs-root/usr/bin/complexweeper"
          test -f "$tmp/squashfs-root/complexweeper.desktop"
          test -f "$tmp/squashfs-root/complexweeper.png"

          # 跑起来也走解压模式，避开 runner 上未必可用的 /dev/fuse
          APPIMAGE_EXTRACT_AND_RUN=1 "$A" --version
          APPIMAGE_EXTRACT_AND_RUN=1 "$A" --selftest "$tmp/st.txt"
          tail -2 "$tmp/st.txt"
          ldd "$tmp/squashfs-root/usr/bin/complexweeper" | sort

      # 18 步真实交互：翻格、插旗、下拉菜单、三种对话框、自定义雷区、缩放、退出。
      # **不装窗口管理器**——无 WM 下窗口固定在 +80+60，坐标才稳定；有 WM 会被随手挪走。
      - name: UI 冒烟（Xvfb）
        working-directory: 正式版
        run: |
          set -euo pipefail
          xvfb-run -a -s '-screen 0 1280x900x24 -nolisten tcp' \
            ./tools/ui_smoke.sh build/cs-linux /tmp/csui
          # 用 sed 不用 head：head 提前退出会给 ls 发 SIGPIPE，set -e + pipefail 会误判失败
          ls /tmp/csui | sed -n '1,12p'

      # 失败时把截图捞出来看 —— 这个冒烟就是靠肉眼截图抓出「数字不显示」「文字偏下」的
      - name: 冒烟截图（仅失败时）
        if: failure()
        uses: actions/upload-artifact@v5
        with:
          name: complexweeper-ui-${{ github.sha }}
          path: /tmp/csui/*.png
          if-no-files-found: ignore

      # if: always() 是为了让 UI 冒烟挂了也还能把包传下来看；
      # 因此这里报 "No files were found" 基本都只是**前面某一步已经挂了**的连带现象，
      # 真正的原因在上面的日志里，往上翻。
      - name: 上传产物与自检报告
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: complexweeper-linux-${{ github.sha }}
          path: |
            正式版/build/*.AppImage
            正式版/build/selftest.txt
          if-no-files-found: error
